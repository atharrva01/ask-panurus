# Local stack (PRD section 12). Ports bind to localhost only; the password is
# for local development and must be changed for the hosted instance.
#
#   docker compose -f deploy/docker-compose.yml up -d postgres tei
name: ask-panurus

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ask
      POSTGRES_PASSWORD: ask
      POSTGRES_DB: ask_panurus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ask -d ask_panurus"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Embedding server. The model is a starting point; the ablations pick the
  # real one by eval score (PRD section 7).
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    command:
      - --model-id
      - ${EMBED_MODEL:-jinaai/jina-embeddings-v2-base-code}
      - --max-client-batch-size
      - "64"
      # The default token budget is sized for large hosts, and warm-up is
      # OOM-killed on a 4 GB machine. 4096 still fits the largest chunk
      # (chunk.Cap keeps chunks near 1,500 estimated tokens). Serving only
      # needs room for a question, so TEI_MAX_BATCH_TOKENS=512 frees memory
      # for a local LLM; it also caps input length, so re-index at 4096.
      - --max-batch-tokens
      - "${TEI_MAX_BATCH_TOKENS:-4096}"
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - hf-cache:/data

  # Local LLM, the free path (PRD section 7). Optional, because it needs
  # several GB of RAM:
  #   docker compose -f deploy/docker-compose.yml --profile llm up -d ollama
  #   docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen2.5-coder:3b
  ollama:
    image: ollama/ollama:0.9.6
    profiles: ["llm"]
    environment:
      # The answer prompt carries up to 6,000 tokens of context, and Ollama
      # silently truncates prompts longer than its window.
      OLLAMA_CONTEXT_LENGTH: "8192"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  hf-cache:
  ollama:
