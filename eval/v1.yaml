  # --------------------------------------------------------------- explain
  - id: q007
    type: explain
    status: draft
    question: How does the sherdlock selector decide which tokens to spend? Does it prefer small or large tokens?
    answer: >-
      It walks the candidate tokens in shuffled order, tries to lock each one,
      adds it to a running sum, and stops as soon as the requested amount is
      covered. Amount plays no part in which token is tried next, only in when
      to stop; there is no smallest-first or other amount-aware strategy and no
      configuration key that selects one.
    required_facts:
      - no amount-aware strategy (no smallest-first)
      - locks candidates as it goes and stops when the sum covers the amount
    gold_ranges:
      - {path: token/services/selector/sherdlock/selector.go, lines: [177, 269]}
      - {path: docs/services/selector.md, lines: [80, 112]}
    needs_sources: [code, doc]
    answerable: true
    source: issue #2023

  - id: q008
    type: explain
    status: draft
    question: How is transaction finality detected on FabricX?
    answer: >-
      FabricX has no block-delivery stream, so finality is detected by
      polling the FabricX query service: an NSListenerManager keeps a shared
      pending-transaction map and a poll loop, and statuses are handed to a
      worker queue that runs the network-agnostic ttx finality listener.
    required_facts:
      - polling the query service, not block delivery
      - shared poller / pending map plus an async worker queue
    gold_ranges:
      - {path: docs/services/finality.md, lines: [102, 148]}
    needs_sources: [doc]
    answerable: true
    source: issue #2368

  - id: q009
    type: explain
    status: draft
    question: How does the EVM driver collect endorsements and decide it has a quorum?
    answer: >-
      Initiator.Collect asks each endorser, discards declined responses and
      unusable deltas, recomputes the EIP-712 digest of each returned delta,
      recovers the signer, and groups signatures by digest. A quorum is reached
      when enough distinct signers agree on the same digest; duplicate signers
      are discarded, and differing deltas are logged as a translator
      determinism bug.
    required_facts:
      - signatures grouped by EIP-712 digest of the returned delta
      - quorum needs a threshold of distinct signers on the same digest
    gold_ranges:
      - {path: x/token/services/network/evm/endorsement/initiator.go, lines: [119, 208]}
    needs_sources: [code]
    answerable: true
    source: code

