  # --------------------------------------------------------------- compare
  - id: q013
    type: compare
    status: draft
    question: How does spent tracking differ between fabtoken and zkatdlog in the ledger translator?
    answer: >-
      They use opposite polarity. Graph-revealing (fabtoken) tokens are spent
      when their output key is absent: inputs must exist and spending deletes
      them, so AreTokensSpent reports spent when the value is empty.
      Graph-hiding (zkatdlog) tokens are spent when a serial-number key is
      present: the serial number must not exist yet and spending writes it, so
      AreTokensSpent reports spent when the value is non-empty.
    required_facts:
      - fabtoken (graph revealing) spent = key absent
      - zkatdlog (graph hiding) spent = serial number present
    gold_ranges:
      - {path: token/services/network/common/rws/translator/translator.go, lines: [182, 209]}
      - {path: token/services/network/common/rws/translator/translator.go, lines: [438, 521]}
    require_all_ranges: false
    needs_sources: [code]
    answerable: true
    source: PR #1701 review comment

  - id: q014
    type: compare
    status: draft
    question: How does finality detection on Fabric differ from FabricX?
    answer: >-
      Fabric streams blocks through FSC's delivery service and maps validated
      transactions to listeners; FabricX has no delivery stream, so it polls
      the FabricX query service from a shared poller and dispatches statuses
      through an async worker queue. Both feed the same network-agnostic ttx
      finality decision layer.
    required_facts:
      - Fabric uses block delivery streaming
      - FabricX polls the query service with a worker queue
    gold_ranges:
      - {path: docs/services/finality.md, lines: [56, 101]}
      - {path: docs/services/finality.md, lines: [102, 148]}
    require_all_ranges: true
    needs_sources: [doc]
    answerable: true
    source: issue #2368

  - id: q015
    type: compare
    status: draft
    question: What is the difference between the mixed, eager and lazy fetcher strategies of the sherdlock selector?
    answer: >-
      mixed (default) serves from the cache and falls back to a database query
      when the cache has nothing for that wallet and currency; eager always
      answers from the cache, which is refreshed on triggers, so it can offer
      already-spent tokens; lazy always queries the database and keeps no
      cache. The trade-off is staleness against query load, and the choice is
      per node.
    required_facts:
      - mixed is the default with cache plus fallback query
      - eager is cache only, lazy is database only
    gold_ranges:
      - {path: docs/services/selector.md, lines: [221, 247]}
    needs_sources: [doc]
    answerable: true
    source: code

