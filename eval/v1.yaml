  # ------------------------------------------------------------------- why
  - id: q017
    type: why
    status: draft
    question: Why doesn't the EVM endorsement request carry the EIP-712 digest for endorsers to sign?
    answer: >-
      By design: each endorser must recompute the StateDelta and its EIP-712
      digest from the actions it validated and sign that, never a digest it
      was handed. Otherwise a malicious initiator could get honest endorsers
      to sign a delta that does not match the request they validated.
    required_facts:
      - endorsers recompute the delta and digest themselves
      - prevents a malicious initiator from getting a mismatched delta signed
    gold_ranges:
      - {path: x/token/services/network/evm/endorsement/messages.go, lines: [42, 64]}
    needs_sources: [code]
    answerable: true
    source: PRD example question (EIP-712 cross-check)

  - id: q018
    type: why
    status: draft
    question: Why does the TokenStateFactory clone and initialize a TokenState in a single transaction?
    answer: >-
      Because initialize is deliberately unguarded (the implementation is
      locked and only a fresh clone can be initialized). Doing it in two
      transactions would leave a window in which anyone could seize the clone
      by initializing it first with their own verifier, and the honest
      deployer's call would revert with AlreadyInitialized.
    required_facts:
      - initialize is unguarded
      - two transactions would let someone else initialize (seize) the clone first
    gold_ranges:
      - {path: docs/services/network-ethereum.md, lines: [470, 483]}
    needs_sources: [doc]
    answerable: true
    source: code

  - id: q019
    type: why
    status: draft
    question: Why don't approver (endorser) nodes track the finality of the token requests they record?
    answer: >-
      Approvers only record the token requests they processed, for auditing.
      The validation logic of the current token drivers is stateless, so they
      do not need to track the requests' status (answered by the maintainer
      in issue #1599).
    required_facts:
      - approvers record requests for auditing purposes
      - driver validation is stateless, so status tracking is not needed
    gold_ranges: []
    gold_refs: [issue/1599]
    needs_sources: [issues]
    answerable: true
    source: issue #1599 (maintainer answer)

